<div class="total">
    <div class="header">
        <h5 class="header--title">
            Karaoke Sorocaba
        </h5>
            <a routerLink="" class="link"><button class="header--button"><i class="fa-solid fa-home"></i>Home</button></a>
    </div>
    <div class="corpo">
        <div class="corpo--inner">
            <div class="busca">
                    <mat-form-field class="busca--form" appearance="fill">
                      <mat-label>Procurar Música</mat-label>
                      <input matInput placeholder="Procurar" [(ngModel)]="termo" (keyup)="validaBotao()">
                      <mat-icon matSuffix>search</mat-icon>
                    </mat-form-field>
                    <button class="busca--button" (click)="buscar()" [disabled]="desabilitado">Buscar</button>
            </div>

            <h4 class="corpo--inner--title">Categorias</h4>

            <a class="corpo--inner--item" [routerLink]="['/nacionais']">
                <img src="../../../assets/images/nacional.png" alt="Nacionais" class="corpo--inner--item--flag">
                <h5 class="corpo--inner--item--title">Nacionais</h5>
            </a>
            <a class="corpo--inner--item" [routerLink]="['/ingles']">
                <img src="../../../assets/images/ingles.png" alt="Ingles" class="corpo--inner--item--flag">
                <h5 class="corpo--inner--item--title">Inglês</h5>
            </a>
            <a class="corpo--inner--item" [routerLink]="['/italiano']">
                <img src="../../../assets/images/italiano.png" alt="Italiano" class="corpo--inner--item--flag">
                <h5 class="corpo--inner--item--title">Italiano</h5>
            </a>
            <a class="corpo--inner--item" [routerLink]="['/espanhol']">
                <img src="../../../assets/images/espanhol.png" alt="Espanhol" class="corpo--inner--item--flag">
                <h5 class="corpo--inner--item--title">Espanhol</h5>
            </a>
            <a class="corpo--inner--item" [routerLink]="['/gospel']">
                <img src="../../../assets/images/gospel.png" alt="Gospel" class="corpo--inner--item--flag">
                <h5 class="corpo--inner--item--title">Gospel</h5>
            </a>
            <a class="corpo--inner--item" [routerLink]="['/infantil']">
                <img src="../../../assets/images/infantil.png" alt="Infantil" class="corpo--inner--item--flag">
                <h5 class="corpo--inner--item--title">Infantil</h5>
            </a>
        </div>
    </div>


    <div class="footer">
        <p class="footer--text">Desenvolvido por <a href="https://prebellisolucoes.com" class="footer--link">Prebelli Soluções</a></p>
    </div>
</div>
